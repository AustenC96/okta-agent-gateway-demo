<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okta Agent Gateway — Live Demo</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo"></div><h1>Agent Gateway</h1></div>
  <div class="who" id="who"></div>
</header>

<section id="personas" class="personas" hidden></section>

<main>
  <section class="path" id="path" aria-label="Who is acting, and the path a request takes"></section>

  <div class="cols">
    <section class="work">
      <ol class="stepper" id="steps">
        <li data-step="discover"><span class="n">1</span><b>Discover</b></li>
        <li data-step="login"><span class="n">2</span><b>Sign in</b></li>
        <li data-step="session"><span class="n">3</span><b>Connect</b></li>
        <li data-step="tools"><span class="n">4</span><b>Use tools</b></li>
      </ol>
      <div class="card stage" id="stage"><div id="stageBody"></div></div>
    </section>

    <aside class="side">
      <div class="card verdict" id="verdict" aria-live="polite"></div>
      <div class="card timeline">
        <div class="tHead"><h3>What happened</h3><span id="count">0 calls</span><button class="ghost" id="clearBtn">Clear</button></div>
        <div id="feed"><div class="empty">Calls appear here as they happen.</div></div>
      </div>
    </aside>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Under the hood" aria-hidden="true">
  <div class="drawerHead"><h2>Under the hood</h2><button class="ghost" id="drawerClose">Close</button></div>
  <div class="flowHead"><span class="muted">Token flow</span><button class="ghost" id="followBtn">Following live</button></div>
  <svg id="dag" viewBox="0 0 560 372" role="img" aria-label="Token flow diagram"></svg>
  <div class="legend">
    <span><i class="sw done"></i>observed</span><span><i class="sw inferred"></i>inferred from Okta’s log</span>
    <span><i class="sw waiting"></i>needs you</span><span><i class="sw error"></i>failed</span><span><i class="sw idle"></i>not reached</span>
  </div>
  <div id="flowDetail"></div>
</aside>
<script src="/app.js"></script>
</body>
</html>
